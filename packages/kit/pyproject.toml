[project]
name = "fish-audio-suite-kit"
version = "0.1.0"
description = "Pure-text Fish Audio cues, filters, cuts, and defaults"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Logan Honeycutt", email = "admin@kzn.sh" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fish_audio_suite_kit"]
