[project]
name = "fish-audio-suite-kit"
version = "0.1.0"
description = "Pure-text Fish Audio cues, filters, cuts, and defaults"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["fish-audio","tts","text-to-speech","cues","streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing",
]
authors = [{ name = "Logan Honeycutt", email = "admin@kzn.sh" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/kzndotsh/fish-audio-suite"
Source = "https://github.com/kzndotsh/fish-audio-suite"
Issues = "https://github.com/kzndotsh/fish-audio-suite/issues"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fish_audio_suite_kit"]
