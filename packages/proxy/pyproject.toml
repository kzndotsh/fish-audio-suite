[project]
name = "fish-audio-suite-proxy"
version = "0.1.0"
description = "OpenAI-compatible Fish Audio TTS/ASR HTTP proxy"
readme = "README.md"
authors = [{ name = "Logan", email = "kzndotsh@users.noreply.github.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "python-multipart>=0.0.12",
    "fish-audio-suite-kit",
]

[project.scripts]
fish-audio-suite-proxy = "fish_audio_suite_proxy.server:main"

[tool.uv.sources]
fish-audio-suite-kit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fish_audio_suite_proxy"]
