[project]
name = "fish-audio-suite-proxy"
version = "0.1.0"
description = "OpenAI-compatible Fish Audio TTS/ASR HTTP proxy"
readme = "README.md"
authors = [{ name = "Logan Honeycutt", email = "admin@kzn.sh" }]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["fish-audio","tts","asr","openai","proxy","fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    # fastapi and python-multipart are deliberately not capped: both are 0.x and ship
    # fixes often, so a cap would hold users on vulnerable releases. CI tests the
    # floors below with `uv sync --resolution lowest-direct`. 0.115.7 is the first
    # fastapi whose Starlette does not leak a stream under the test client, and
    # python-multipart 0.0.18 fixes a boundary-parsing denial of service.
    "fastapi>=0.115.7",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "ormsgpack>=1.5",
    "python-multipart>=0.0.18",
    "fish-audio-suite-kit>=0.1,<0.2",
]

[project.scripts]
fish-audio-suite-proxy = "fish_audio_suite_proxy.server:main"

[tool.uv.sources]
fish-audio-suite-kit = { workspace = true }

[project.urls]
Homepage = "https://github.com/kzndotsh/fish-audio-suite"
Source = "https://github.com/kzndotsh/fish-audio-suite"
Issues = "https://github.com/kzndotsh/fish-audio-suite/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fish_audio_suite_proxy"]
