[project]
name = "fish-audio-suite-voice"
version = "0.1.0"
description = "Importable Fish live TTS websocket, playback sinks, and a duplex CLI recipe"
readme = "README.md"
authors = [{ name = "Logan Honeycutt", email = "admin@kzn.sh" }]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["fish-audio","tts","asr","voice","duplex","websocket"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Environment :: Console",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "fish-audio-sdk>=1.0,<2",
    "httpx>=0.28",
    "numpy>=2.0",
    "fish-audio-suite-kit>=0.1,<0.2",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
speakers = ["sounddevice>=0.5"]
# webrtcvad-wheels, not PyPI webrtcvad: the original has no wheel for Python 3.12.
vad = ["webrtcvad-wheels>=2.0.14"]
aec = ["pywebrtc-audio>=0.2"]
# The full-screen terminal app (fish-voice --tui). Keep the bound equal to the one in the
# root test group, which a test checks.
tui = ["textual>=8.2.8"]
# Streaming speech recognition through Deepgram (FISH_VOICE_STT=deepgram). The new asyncio
# client (websockets.asyncio) starts at 14. Keep the bound equal to the root test group's.
deepgram = ["websockets>=14"]
cli = [
    "sounddevice>=0.5",
    "webrtcvad-wheels>=2.0.14",
    "pywebrtc-audio>=0.2",
    "openrouter>=1.2",
]

[project.scripts]
fish-audio-suite-voice = "fish_audio_suite_voice.cli:main"
fish-voice = "fish_audio_suite_voice.cli:main"

[tool.uv.sources]
fish-audio-suite-kit = { workspace = true }

[project.urls]
Homepage = "https://github.com/kzndotsh/fish-audio-suite"
Source = "https://github.com/kzndotsh/fish-audio-suite"
Issues = "https://github.com/kzndotsh/fish-audio-suite/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fish_audio_suite_voice"]
