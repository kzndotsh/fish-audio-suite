[project]
name = "fish-audio-suite-voice"
version = "0.1.0"
description = "Importable Fish live TTS websocket, playback sinks, and a duplex CLI recipe"
readme = "README.md"
authors = [{ name = "Logan Honeycutt", email = "admin@kzn.sh" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fish-audio-sdk>=1.0",
    "httpx>=0.28",
    "numpy>=2.0",
    "fish-audio-suite-kit",
]

[project.optional-dependencies]
speakers = ["sounddevice>=0.5"]
vad = ["webrtcvad>=2.0.10"]
cli = ["sounddevice>=0.5", "webrtcvad>=2.0.10"]

[project.scripts]
fish-audio-suite-voice = "fish_audio_suite_voice.cli:main"
fish-voice = "fish_audio_suite_voice.cli:main"

[tool.uv.sources]
fish-audio-suite-kit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fish_audio_suite_voice"]
