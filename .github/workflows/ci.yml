name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  PYTHON_VERSION: "3.12"
jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Sync
        run: uv sync --frozen --all-packages --extra cli --group dev --group test
      - name: Ruff check
        run: uv run ruff check packages
      - name: Ruff format
        run: uv run ruff format --check packages
      - name: Docstrings
        run: uv run pydoclint --config=pyproject.toml packages
      - name: Types
        run: uv run basedpyright
      - name: Tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run pytest --cov=fish_audio_suite_kit --cov=fish_audio_suite_proxy --cov=fish_audio_suite_voice --cov-branch --cov-report=term-missing --cov-fail-under=71
      - name: Prune uv cache for CI
        if: always()
        run: uv cache prune --ci
