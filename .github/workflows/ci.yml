name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync
        run: uv sync --frozen --all-packages --extra cli --group dev --group test
      - name: Ruff check
        run: uv run ruff check packages
      - name: Ruff format
        run: uv run ruff format --check packages
      - name: Docstrings
        run: uv run pydoclint --config=pyproject.toml packages
      - name: Types
        run: uv run basedpyright
      - name: Tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        # Floors sit about a point under the measured branch coverage (total 90.7,
        # kit 95.7, proxy 95.7, voice 86.0). Raise them when coverage rises. The
        # per-package steps read the .coverage file the test run wrote.
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=89
      - name: Coverage floor (kit)
        run: uv run coverage report --include="packages/kit/*" --fail-under=94 --skip-covered
      - name: Coverage floor (proxy)
        run: uv run coverage report --include="packages/proxy/*" --fail-under=94 --skip-covered
      - name: Coverage floor (voice)
        run: uv run coverage report --include="packages/voice/*" --fail-under=85 --skip-covered
      - name: Prune uv cache for CI
        if: always()
        run: uv cache prune --ci
  lowest:
    name: Lowest dependency versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          # The lowest set is a different resolution from uv.lock, so it gets no cache.
          enable-cache: false
      - name: Sync the lowest direct versions
        # Not --frozen: the resolver picks the declared minimum of every direct
        # dependency, so the floors in pyproject.toml are tested, not assumed.
        run: uv sync --resolution lowest-direct --all-packages --extra cli --group dev --group test
      - name: Tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run pytest
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
      - name: Lint the workflows with zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor==1.30.1 --no-progress .github/workflows
  build:
    name: Build wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build
        run: uv build --all --out-dir dist
      - name: Check metadata
        run: uvx twine check --strict dist/*
  nix:
    name: Nix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Flake check
        run: nix flake check --print-build-logs
  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build proxy image
        run: docker build --tag fish-audio-suite-proxy:ci .
      - name: Smoke health
        run: |
          docker run --detach --name proxy --publish 127.0.0.1:8849:8849 fish-audio-suite-proxy:ci
          for _ in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:8849/health && exit 0
            sleep 1
          done
          docker logs proxy
          exit 1
