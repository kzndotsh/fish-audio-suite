name: Audit
# Checks the locked dependencies against known vulnerabilities. It runs when a
# change touches the lock or a pyproject, and weekly, because a new advisory can
# land against a version that has not changed.
on:
  pull_request:
    paths:
      - uv.lock
      - pyproject.toml
      - packages/*/pyproject.toml
      - .github/workflows/audit.yml
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pip-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Export the locked requirements
        # Hashed, so pip-audit checks exactly what uv.lock installs. The workspace
        # packages are ours and not on PyPI, so they are left out.
        run: uv export --frozen --all-packages --no-emit-workspace --extra cli --group dev --group test --output-file requirements-audit.txt
      - name: Audit
        # Fails the job when a pinned version has a known vulnerability.
        run: uvx pip-audit==2.10.1 --requirement requirements-audit.txt --disable-pip --progress-spinner off
