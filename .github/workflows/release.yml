name: Release
# Publishes the three wheels to PyPI when a v* tag is pushed.
# Inert until the repo variable PYPI_PUBLISH is "true" and a PyPI trusted
# publisher (workflow release.yml, environment pypi) exists for each dist.
on:
  push:
    tags: ["v*"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
      - name: Build
        run: uv build --all --out-dir dist
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - name: Publish
        if: vars.PYPI_PUBLISH == 'true'
        run: uv publish --trusted-publishing always dist/*
        env:
          UV_PUBLISH_URL: https://upload.pypi.org/legacy/
