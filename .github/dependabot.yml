version: 2
# Every ecosystem waits a week before it proposes a release (cooldown), so a
# release that is pulled or found broken in its first days never reaches a PR.
# Security updates ignore the cooldown.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Runtime bumps change what users install, dev bumps only change CI, so they
    # get separate pull requests that can be reviewed and reverted on their own.
    groups:
      runtime:
        dependency-type: production
        patterns: ["*"]
      dev:
        dependency-type: development
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      nix:
        patterns: ["*"]
