[project]
name = "fish-audio-suite"
version = "0.1.0"
description = "Unofficial Fish Audio toolkit for apps that need TTS, ASR, and live speech"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Logan", email = "kzndotsh@users.noreply.github.com" }]
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/fish-audio-suite-kit",
    "packages/fish-audio-suite-proxy",
    "packages/fish-audio-suite-voice",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "packages/fish-audio-suite-kit/src",
    "packages/fish-audio-suite-proxy/src",
    "packages/fish-audio-suite-voice/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
