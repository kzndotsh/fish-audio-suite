[project]
name = "fish-audio-suite"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
default-groups = ["dev", "test"]

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.13",
    "basedpyright==1.40.1",
    "pydoclint>=0.7.3",
]
test = [
    "hypothesis>=6.140",
    "pytest-cov>=7",
    "pytest-randomly>=3.16",
    "pytest-socket>=0.7",
    "pytest-timeout>=2.4",
]

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
# Shared test helpers live next to the tests under unique module names, so two
# packages can never both claim a package called "tests".
pythonpath = ["packages/kit/tests", "packages/proxy/tests", "packages/voice/tests"]
markers = [
    "perf: timing guards. A slow runner can trip them, so run `-m 'not perf'` to skip them.",
]
strict = true
timeout = 60
# Every warning is an error, so a leaked file or an unawaited coroutine fails CI.
# Each ignore below names a third-party warning and the code that raises it.
filterwarnings = [
    "error",
    # Starlette's TestClient still imports httpx and warns about httpx2 on import. The
    # class (StarletteDeprecationWarning, a UserWarning) only exists from starlette
    # 1.2, and pytest cannot parse a filter naming a missing class, so the category
    # is the base class and the message keeps the filter narrow.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated:UserWarning",
    # Starlette's TestClient reads an anyio alias that anyio has deprecated.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
# Doctests run from kit's source, which holds the Examples in its docstrings. The root
# conftest.py keeps proxy and voice out of doctest collection, since they have none.
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE"]
addopts = [
    "--import-mode=importlib",
    "--doctest-modules",
    "--disable-socket",
    # asyncio's self-pipe is AF_UNIX. AF_INET stays blocked.
    "--allow-unix-socket",
    "--strict-markers",
    "--durations=10",
]

[tool.coverage.run]
source = [
    "fish_audio_suite_kit",
    "fish_audio_suite_proxy",
    "fish_audio_suite_voice",
]
branch = true
relative_files = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 0
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4
src = [
    "packages/kit/src",
    "packages/proxy/src",
    "packages/voice/src",
]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
fixable = ["ALL"]
unfixable = []
ignore = [
    "E501",    # line-too-long (formatter owns wrap)
    "ANN401",  # any-type: JSON bodies and SDK payloads are untyped at the boundary
    "PLR0911", # too-many-return-statements: scrubbers and parsers return early on purpose
    "PLR0913", # too-many-arguments: TTS and ASR knobs map one to one onto Fish request fields
    "PLR2004", # magic-value-comparison: audio sample sizes and HTTP statuses read better inline
    "TRY003",  # vanilla exception messages: the message carries the request detail
    "EM101",   # string literal in exception: same reason as TRY003
    "EM102",   # f-string in exception: same reason as TRY003
]
select = [
    "I",     # isort
    "E",     # pycodestyle-error
    "F",     # pyflakes
    "PERF",  # perflint
    "N",     # pep8-naming
    "TRY",   # tryceratops
    "UP",    # pyupgrade
    "FURB",  # refurb
    "PL",    # pylint
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "EM",    # flake8-errmsg
    "PIE",   # flake8-pie
    "Q",     # flake8-quotes
    "RET",   # flake8-return
    "PTH",   # flake8-use-pathlib
    "INP",   # flake8-no-pep420
    "RSE",   # flake8-raise
    "ICN",   # flake8-import-conventions
    "PT",    # flake8-pytest-style
    "RUF",   # ruff
    "D",     # pydocstyle (numpy)
    "S",     # flake8-bandit
    "BLE",   # flake8-blind-except
    "SLF",   # flake8-self (private member access)
    "T20",   # flake8-print
    "ERA",   # eradicate (commented-out code)
    "PGH",   # pygrep-hooks
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "SLOT",  # flake8-slots
    "ARG",   # flake8-unused-arguments
    "ANN",   # flake8-annotations (ANN401 is ignored above)
]
# Left off on purpose:
#   FBT  - public helpers such as env_bool(name, default) take a positional default
#   TC   - FastAPI needs runtime annotations, so most moves would break routes
#   C90  - PLR0912 and PLR0915 already cover branch and statement counts


[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = [
    "fish_audio_suite_kit",
    "fish_audio_suite_proxy",
    "fish_audio_suite_voice",
]

[tool.ruff.lint.pylint]
# The scrubbers and the stream scrubber branch on many text cases. 15 keeps the
# worst of them in bounds without a noqa per function.
max-branches = 15

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**" = [
    "INP001",  # tests are not packages
    "PLR2004", # expected values are literals
    "PLR0915", # long scenario tests
    "PLC0415", # tests import inside the test on purpose
    "D",
    "S101",    # assert is the point
    "S104",    # a bind-all address in a settings test
    "S105",    # fake keys
    "S106",
    "SLF001",  # tests reach into private helpers
    "ARG",     # fixtures and fakes with unused arguments
    "ANN",
]
"conftest.py" = ["ANN", "ARG"]
# Repo-level tests: they read source and docs, not product code.
"tests/**" = [
    "INP001", # tests are not packages
    "D",      # test names and messages carry the intent
    "S101",   # assert is the point
    "PLR2004", # expected values are literals
]
# Cue and ASR text patterns use the real unicode quotes and dashes.
"packages/kit/src/fish_audio_suite_kit/{asr_text,_charsets,cues,cuts,dialogue,_single_pass,scrub_tts,stream_holds}.py" = ["RUF001"]
"packages/voice/src/fish_audio_suite_voice/{spoken,stream_scrub}.py" = ["RUF001"]
"packages/proxy/src/fish_audio_suite_proxy/phrases.py" = ["RUF001"]
"packages/proxy/tests/test_proxy_asr_phrases.py" = ["RUF001"]
"packages/kit/tests/{test_asr_text,test_cues,test_dialogue,test_scrub_tts}.py" = ["RUF001"]
"packages/voice/tests/{test_wire,test_spoken_properties,test_stream_scrub_properties}.py" = ["RUF001"]
# These modules import the optional extras (sounddevice, webrtcvad, pywebrtc_audio,
# openrouter) inside functions, so the base install imports without them.
"packages/voice/src/fish_audio_suite_voice/{aec,barge,listen,llm,playback,transports}.py" = ["PLC0415"]
# Both print to the terminal on purpose.
"packages/voice/src/fish_audio_suite_voice/{console,debug,cli}.py" = ["T20"]

[tool.pydoclint]
style = "numpy"
exclude = [
    ".venv",
    "**/tests/**",
]
arg-type-hints-in-docstring = true
arg-type-hints-in-signature = true
check-return-types = true
check-yield-types = true
allow-init-docstring = true
skip-checking-short-docstrings = true
require-return-section-when-returning-nothing = false
check-style-mismatch = true

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.basedpyright]
pythonVersion = "3.12"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = ["packages", "tests"]
exclude = [".venv", "dist", "**/__pycache__"]
extraPaths = [
    "packages/kit/src",
    "packages/proxy/src",
    "packages/voice/src",
]
reportUnnecessaryTypeIgnoreComment = "warning"
reportMissingTypeStubs = "none"
allowedUntypedLibraries = ["sounddevice", "webrtcvad", "fishaudio", "pywebrtc_audio"]

[[tool.basedpyright.executionEnvironments]]
root = "packages/proxy/tests"
# 170 hits, all from Starlette's TestClient: post, get and friends are only
# partially typed upstream, so every call result is "partially unknown".
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
# Tests reach into a few private helpers on purpose. Each use is a warning.
reportPrivateUsage = "warning"

[[tool.basedpyright.executionEnvironments]]
root = "packages/voice/tests"
# 35 lambda hits and 28 argument hits, all lambdas handed to monkeypatch.setattr,
# which gives them no type to infer from.
reportUnknownLambdaType = "none"
reportUnknownArgumentType = "none"
# Tests reach into a few private helpers on purpose. Each use is a warning.
reportPrivateUsage = "warning"

[[tool.basedpyright.executionEnvironments]]
root = "packages/kit/src"

[[tool.basedpyright.executionEnvironments]]
root = "packages/proxy/src"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/voice/src"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportMissingTypeStubs = "none"
